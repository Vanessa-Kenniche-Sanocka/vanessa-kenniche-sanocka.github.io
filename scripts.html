<script>
  // Traductions de la navbar — ordre positionnel (inclut les sous-items du dropdown "Experience")
  const translations = {
      'en': ['About', 'Professional', 'ML & Data Engineering', 'Data Science', 'Academic', 'Other', 'Overview'],
      'fr': ['À propos', 'Professionnel', 'ML & Data Ingénierie', 'Data Science', 'Académique', 'Autre', 'Compétences'],
      'pl': ['O mnie', 'Zawodowe', 'ML i Inżynieria Danych', 'Data Science', 'Akademickie', 'Inne', 'Umiejętności']
  };

  (function() {
      const currentLang = document.documentElement.lang ||
                         (window.location.href.includes('.fr.') ? 'fr' :
                          window.location.href.includes('.pl.') ? 'pl' : 'en');

      function translateNavbar() {
          const navLinks = document.querySelectorAll(
              '.navbar-nav:not(.ms-auto) .nav-link, .navbar-nav:not(.ms-auto) .dropdown-item'
          );
          const currentFile = `index.${currentLang}.html`;
          let navIndex = 0;

          navLinks.forEach(link => {
              if (navIndex < translations[currentLang].length) {
                  link.textContent = translations[currentLang][navIndex];
                  navIndex++;
              }
              const originalHref = link.getAttribute('href');
              if (originalHref && originalHref.includes('#')) {
                  const anchor = originalHref.split('#')[1];
                  const newHref = currentFile + '#' + anchor;
                  link.setAttribute('href', newHref);
              }
          });
      }

      if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', translateNavbar);
      } else {
          translateNavbar();
      }

      const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
              if (mutation.type === 'childList' &&
                  mutation.target.classList &&
                  mutation.target.classList.contains('navbar-nav')) {
                  translateNavbar();
                  observer.disconnect();
              }
          });
      });

      function startObserve() {
        observer.observe(document.body, { childList: true, subtree: true });
      }
      if (document.body) startObserve();
      else document.addEventListener('DOMContentLoaded', startObserve);
  })();

  // Smooth scroll
  window.addEventListener('load', function() {
      const anchorLinks = document.querySelectorAll('.navbar-nav .nav-link[href*="#"]');
      anchorLinks.forEach(link => {
          link.addEventListener('click', function(e) {
              const href = this.getAttribute('href');
              const anchor = href.split('#')[1];
              if (anchor && document.querySelector('#' + anchor)) {
                  e.preventDefault();
                  document.querySelector('#' + anchor).scrollIntoView({
                      behavior: 'smooth', block: 'start'
                  });
                  history.replaceState(null, null, href);
              }
          });
      });
  });

  // Scroll-spy via IntersectionObserver — meilleur perf que scroll listener
  (function () {
      function init() {
          const sectionIds = ['about', 'experience', 'education', 'other', 'overview'];
          const sections = sectionIds.map(id => document.getElementById(id)).filter(Boolean);
          const navLinks = document.querySelectorAll('.navbar-nav .nav-link[href*="#"]');
          if (!sections.length || !navLinks.length) return;

          function setActive(id) {
              navLinks.forEach(link => {
                  const href = link.getAttribute('href');
                  const anchor = href && href.includes('#') ? href.split('#')[1] : null;
                  if (anchor === id) link.classList.add('active');
                  else link.classList.remove('active');
              });
          }

          const observer = new IntersectionObserver((entries) => {
              let best = null;
              entries.forEach(e => {
                  if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) {
                      best = e;
                  }
              });
              if (best) setActive(best.target.id);
          }, {
              rootMargin: '-40% 0px -50% 0px',
              threshold: [0, 0.25, 0.5, 0.75, 1]
          });

          sections.forEach(s => observer.observe(s));
      }

      if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
      } else {
          init();
      }
  })();

  // Click sur "Professionnel" (dropdown toggle) → scroll vers #experience
  (function () {
      function init() {
          const toggle = document.querySelector('.navbar-nav .nav-item.dropdown > .nav-link.dropdown-toggle');
          if (!toggle) return;
          toggle.addEventListener('click', function (e) {
              e.preventDefault();
              const target = document.getElementById('experience');
              if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
      }
      if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
      } else {
          init();
      }
  })();

  // Recherche des compétences dans la section Overview
  (function () {
      function norm(s) {
          return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      }
      function init() {
          const input = document.querySelector('.skills-search');
          if (!input) return;
          const overview = input.closest('.overview') || document;
          const chips = Array.from(overview.querySelectorAll('.skill-chip'));
          // Chaque catégorie = section.level2 (Pandoc wrap via section-divs)
          const categories = Array.from(overview.querySelectorAll('section.level2'));

          function filter() {
              const q = norm(input.value.trim());
              chips.forEach(chip => {
                  const match = !q || norm(chip.textContent).includes(q);
                  chip.classList.toggle('is-hidden', !match);
              });
              categories.forEach(cat => {
                  const anyVisible = Array.from(cat.querySelectorAll('.skill-chip'))
                      .some(c => !c.classList.contains('is-hidden'));
                  cat.classList.toggle('is-empty', !anyVisible);
              });
          }
          input.addEventListener('input', filter);
      }
      if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
      } else {
          init();
      }
  })();

  // Toggle thème clair/sombre
  (function () {
      const labels = {
          en: { toDark: 'Switch to dark theme', toLight: 'Switch to light theme' },
          fr: { toDark: 'Passer en mode sombre',  toLight: 'Passer en mode clair' },
          pl: { toDark: 'Przełącz na tryb ciemny', toLight: 'Przełącz na tryb jasny' }
      };
      const lang = document.documentElement.lang ||
                   (location.pathname.includes('.fr.') ? 'fr' :
                    location.pathname.includes('.pl.') ? 'pl' : 'en');
      const L = labels[lang] || labels.en;

      function getTheme() {
          return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }
      function renderBtn(btn, theme) {
          btn.textContent = theme === 'dark' ? '☀' : '☾';
          btn.setAttribute('aria-label', theme === 'dark' ? L.toLight : L.toDark);
          btn.setAttribute('title', btn.getAttribute('aria-label'));
      }
      function applyTheme(theme) {
          const root = document.documentElement;
          root.classList.add('theme-transition');
          root.setAttribute('data-theme', theme);
          try { localStorage.setItem('theme', theme); } catch (e) {}
          const btn = document.getElementById('theme-toggle');
          if (btn) renderBtn(btn, theme);
          setTimeout(function () { root.classList.remove('theme-transition'); }, 350);
      }
      function injectToggle() {
          const nav = document.querySelector('.navbar-nav.ms-auto');
          if (!nav || document.getElementById('theme-toggle')) return;
          const li = document.createElement('li');
          li.className = 'nav-item';
          const btn = document.createElement('button');
          btn.id = 'theme-toggle';
          btn.className = 'theme-toggle';
          btn.type = 'button';
          renderBtn(btn, getTheme());
          btn.addEventListener('click', function () {
              applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
          });
          li.appendChild(btn);
          nav.appendChild(li);
      }
      if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', injectToggle);
      } else {
          injectToggle();
      }
  })();
</script>
